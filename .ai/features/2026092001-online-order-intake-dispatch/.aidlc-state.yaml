    by: Akenzy
    reason: T-07-02 is blocked by two defects in T-07-01 (which I implemented), both verified. (1) SalesOrderService.cancel is owner-only - it calls salespersonOf(actor) then isOwn(), which is 'order.salespersonId === me || order.createdBy === me'. createFromPartner writes salespersonId NULL and createdBy = the API key's shadow user, and nothing reassigns it — so NO backoffice user can ever cancel a web order; every call 404s. That contradicts A-14, which says the canceller is the ERP user. getById already has the right relaxation via scopeOf (returns {} for a holder of approve); cancel must use it. (2) INVOICE_NOT_CANCELLABLE exists ONLY in sales-order.service.spec.ts -562 as my own mock — production CancelInvoiceService throws plain BadRequestException with English text that leaks raw enum values (PAID, SALE). My T-07-01 rollback spec therefore asserts against a code reality never emits. Widening T-07-02 to carry both API fixes so the UI ticket can actually be built.
