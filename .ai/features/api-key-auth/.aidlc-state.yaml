  - gate: G2
    action: reopened
    at: 2026-08-19T14:25:34
    by: Akenzy
    reason: ADR-01's claim 'PermissionGuard needs zero changes' is false - RbacService.resolvePermissions() always re-derives permissions from a DB user_roles lookup keyed by userId, never from request.user.roles. An API-key-authenticated request (userId='api-key -<id>', no real users/user_roles row) fails every permission check system-wide. Fix - each API key gets a real shadow user row (users + user_roles), so AuthGuard sets request.user.userId to a genuine id and PermissionGuard/RbacService truly need zero changes, matching the original ADR intent.
