<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản trị ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Gắn theme trước paint đầu tiên để không nháy màu khi tải lại.
         Khoá "bo-theme" khớp THEME_STORAGE_KEY trong src/store/common/theme/theme.constant.ts. -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem("bo-theme") || "{}").state;
        if (t && t.themeId) document.documentElement.dataset.theme = t.themeId;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
