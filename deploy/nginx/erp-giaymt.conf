# erp.giaymt.com.vn — all three jack-erp apps on one hostname, by path.
#
#   /      -> backoffice SPA (PM2 erp-backoffice-web, :3000)
#   /pos/  -> POS SPA        (PM2 erp-pos-web,        :3001, vite base=/pos/)
#   /api/  -> NestJS API     (PM2 erp-api,            :4000)
#
# Because everything is same-origin, the SPAs call the API with a relative
# "/api" and no CORS is involved at all.
#
# Socket.IO needs the Upgrade header forwarded verbatim. Defined here so this
# file is self-contained and can be deployed on its own.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Keepalive pools to the PM2 backends. Without these, nginx opened and tore down
# a fresh TCP connection per request: the websocket `map` below resolves to
# "close" for ordinary requests (they carry no Upgrade header), which cancels
# keep-alive. `keepalive` requires an upstream block plus HTTP/1.1 and an empty
# Connection header on the proxied request.
upstream erp_backoffice { server 127.0.0.1:3000; keepalive 32; }
upstream erp_pos        { server 127.0.0.1:3001; keepalive 32; }
upstream erp_api        { server 127.0.0.1:4000; keepalive 32; }

server {
    server_name erp.giaymt.com.vn;

    access_log /var/log/nginx/erp-giaymt.access.log;
    error_log  /var/log/nginx/erp-giaymt.error.log;

    # Excel/CSV import uploads exceed nginx's 1m default.
    client_max_body_size 50m;

    # ── API ───────────────────────────────────────────────────────────────
    # Trailing slash on proxy_pass strips the /api prefix, so /api/auth/login
    # reaches Nest as /auth/login (the API has no global prefix).
    location /api/ {
        proxy_pass http://erp_api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Empty Connection header keeps the upstream socket pooled. Websockets
        # are handled by the longer-prefix /api/socket.io/ location below.
        proxy_set_header Connection "";

        # Report/export endpoints stream well past the 60s default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering    off;
    }

    # ── Socket.IO ─────────────────────────────────────────────────────────
    # Longer prefix than /api/, so nginx picks this for websocket traffic
    # regardless of ordering. Upgraded connections are dedicated, never pooled.
    location /api/socket.io/ {
        proxy_pass http://erp_api/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── POS SPA ───────────────────────────────────────────────────────────
    # No trailing slash on proxy_pass: the /pos/ prefix is preserved, because
    # vite was built with base=/pos/ and serves its assets under that path.
    location = /pos { return 301 /pos/; }

    location /pos/ {
        proxy_pass http://erp_pos;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # ── Backoffice SPA (root) ─────────────────────────────────────────────
    location / {
        proxy_pass http://erp_backoffice;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    listen [::]:443 ssl ipv6only=on http2; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/erp.giaymt.com.vn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/erp.giaymt.com.vn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = erp.giaymt.com.vn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name erp.giaymt.com.vn;
    return 404; # managed by Certbot


}
